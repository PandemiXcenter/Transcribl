# All non-secret behavior is configured here. Copy to `config/name.local.toml`
# for personal settings; local configs are ignored by Git.
config_version = 1

[paths]
# Relative paths resolve from this TOML file's directory.
artifacts_dir = "../artifacts"

[extraction]
image_dpi = 150

[provider]
name = "gemini"

[provider.gemini]
# A stable multimodal model with structured-output support. Change without code.
model = "gemini-3.8-flash"
# Models colleagues may choose in the local Settings tab.
selectable_models = ["gemini-3.8-flash"]
api_version = "v1"
request_timeout_seconds = 120
request_attempts = 3
# Conservative encoded request ceiling below Gemini's 20 MB inline-image limit.
max_inline_request_bytes = 19000000
thinking_level = "default"
thinking_level_choices = ["default", "low", "medium", "high"]

[provider.openai]
model = "gpt-6-astra"
selectable_models = ["gpt-6-astra", "gpt-6.1-sol", "gpt-6-luna"]
request_timeout_seconds = 180
request_attempts = 3
max_inline_request_bytes = 19000000
max_output_tokens = 32768
thinking_level = "default"
thinking_level_choices = ["default", "low", "medium", "high", "xhigh", "max"]

[provider.anthropic]
model = "claude-opus-5-5"
selectable_models = ["claude-opus-5-5", "claude-sonnet-5-5", "claude-haiku-5-5"]
request_timeout_seconds = 180
request_attempts = 3
max_inline_request_bytes = 19000000
max_output_tokens = 32768
thinking_level = "default"
thinking_level_choices = ["default", "low", "medium", "high", "xhigh", "max"]

[translation]
source_language = "Danish"
target_language = "English"
# One of: "faithful", "balanced", "readable"
style = "balanced"
custom_instructions = ""
# Optional visual guidance supplied to the model for recognizing this corpus's footnotes.
footnote_appearance_instructions = ""
preserve_names = true
preserve_citations = true
# Set false to disable marking regardless of the configured level.
mark_uncertain_terms = true
# One of: "low", "standard", "high"
uncertainty_level = "standard"
# Optional extra review targets, for example all numbers or all medical terms.
uncertainty_instructions = ""
# General prior-page context window. When nonzero, also send the full linked
# unfinished paragraph for scoped repair; zero disables both kinds of context.
previous_page_context_count = 2

# Add source-term = "preferred target rendering" pairs here.
[translation.glossary]

[export]
include_page_comments = true
include_headers = false
include_footers = false
include_page_numbers = false

[pdf_export]
# Reviewed PDF downloads are typeset locally; no document content leaves the computer.
latex_engine = "xelatex"
compile_timeout_seconds = 120

[desktop]
window_width = 1440
window_height = 1000
minimum_width = 900
minimum_height = 650

[web]
# Custom is appended by the UI, including for defaults absent from this list.
language_choices = ["Danish", "English", "Norwegian", "Swedish", "German", "French", "Spanish", "Italian", "Portuguese", "Dutch", "Finnish", "Icelandic", "Latin", "Greek", "Polish", "Ukrainian", "Russian", "Arabic", "Hebrew", "Hindi", "Chinese", "Japanese", "Korean"]
# The editor is intentionally local-only until authentication is added.
host = "127.0.0.1"
port = 8000
# Only used by the optional browser-mode `serve` command; `app` opens a native window.
open_browser_on_start = true
max_upload_bytes = 100000000
max_concurrent_jobs = 1
max_pdf_pages = 500
max_glossary_name_characters = 100
max_glossary_entries = 500
max_term_characters = 500
max_instruction_characters = 4000
# Choices displayed for each translation job. "off" maps to mark_uncertain_terms = false.
uncertainty_level_choices = ["off", "low", "standard", "high"]
status_poll_interval_ms = 1000
# Original-page zoom choices in the validation workspace. The selection persists across pages.
review_zoom_levels = [100, 125, 150, 175, 200]
review_zoom_default_percent = 100
# Retry a stopped page automatically for new web jobs. The UI can override the default.
auto_continue_default = false
# Bound provider cost when Auto continue is enabled.
auto_continue_attempts = 1

[workbench]
# Settings changes are stored in .settings.toml under the configured artifact root.
default_glossary = "none"
max_styles = 50
max_style_prompt_characters = 4000

[workbench.style_prompts]
faithful = "Remain as close as the target language permits to source wording, syntax, and historical register. Preserve every supported fact."
balanced = "Preserve meaning and tone while using natural target-language syntax. Preserve every supported fact."
readable = "Prioritize fluent modern target-language prose without omitting, summarizing, or inventing information."

# Approximate standard paid-tier USD prices, per one million tokens.
# Pricing is a display projection, never part of translation/cache identity.
[costs]
default_currency = "DKK"
currency_choices = ["DKK", "EUR", "USD", "GBP"]
minimum_matching_pages = 5
max_history_pages = 1000

[costs.prices."gemini-3.8-flash"]
provider = "gemini"
input_usd_per_million = 0.75
output_usd_per_million = 3.75
checked_on = 2026-10-12
valid_until = 2026-12-31
source = "https://ai.google.dev/gemini-api/docs/pricing"
note = "Introductory Gemini pricing through December 31, 2026."

